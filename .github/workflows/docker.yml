name: Build and publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: resume-pandoc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: IMAGE=resume-pandoc:test tests/run.sh

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            /^## /  { on = ($0 ~ "^## \\[" v "\\]") ; next }
            on && !/^\[[^]]+\]: /
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for ${{ steps.ver.outputs.version }}"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # Re-releasing the same VERSION replaces the tag and release (patching).
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --notes-file notes.md
